[package]
name = "dexrs"
authors = ["makors"]
description = "Rust library for fetching Dexcom glucose values"
version = "0.1.3"
edition = "2024"
license-file = "LICENSE"
repository = "https://github.com/makors/dexrs"
readme = "README.md"
keywords = ["t1d", "diabetes", "dexcom"]

[dependencies]
chrono = "0.4.45"
phf = { version = "0.11.3", features = ["macros"] }
regex = "1.13.1"
reqwest = { version = "0.12.28", features = ["cookies", "json", "blocking"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = "1.26.1"
